# Creates a GitHub Release when a semantic-version tag (vX.Y.Z) is pushed.
# Zenodo's GitHub integration archives each published release and assigns a DOI;
# see README "Citing this repository".

name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  github-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: dist/*
          body: |
            This release includes a wheel and sdist built with `python -m build`. Install from the downloaded wheel with `pip install ./bipolar_colormap-*.whl`, or from a checkout of this tag with `pip install .`.

            Zenodo will archive this tag if [GitHub integration](https://help.zenodo.org/docs/github/) is enabled for the repository. Use the version DOI from Zenodo in `CITATION.cff` so the GitHub "Cite this repository" panel lists it.
