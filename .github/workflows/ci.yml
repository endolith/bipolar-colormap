# Smoke-test installs on supported Python versions (no test suite in-repo yet).

name: CI

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.12"]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: python -m pip install --upgrade pip && python -m pip install .

      - name: Import and build colormaps (headless matplotlib)
        run: |
          python -c "import matplotlib; matplotlib.use('Agg'); from bipolar import bipolar, hotcold; bipolar(); hotcold(); print('ok')"
