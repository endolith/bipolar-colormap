[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bipolar-colormap"
version = "0.1.0"
description = "Hot and cold colormap for diverging data"
readme = "README.md"
license = "BSD-2-Clause"
license-files = ["LICENSE.txt"]
authors = [{ name = "endolith" }]
requires-python = ">=3.8"
dependencies = [
    "matplotlib>=3.3",
    "numpy>=1.19",
    "scipy>=1.5",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Visualization",
]

[project.optional-dependencies]
examples = [
    "cmasher>=1.5",
    "colorcet>=2.0",
]

[project.urls]
Homepage = "https://github.com/endolith/bipolar-colormap"
Repository = "https://github.com/endolith/bipolar-colormap.git"

[tool.setuptools]
py-modules = ["bipolar"]
